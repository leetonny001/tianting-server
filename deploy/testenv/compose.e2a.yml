# E2a 静态双节点：E1 + n2。同一个 JWT 密钥（都读 .run/im.env），各自的 SQLite，静态节点列表（.run/nodes/nodes.json）。
# 版本号故意和 n1 不同（AC-OPS-04-6）。
services:
  n2:
    build:
      context: ../../server
      dockerfile: ../deploy/testenv/im.Dockerfile
      args: {VERSION: 0.3.1}
    image: tianting-testenv/im:0.3.1
    env_file: [.run/im.env, .run/n2.env]
    restart: "no"
    volumes: [n2-data:/data]
    ports:
      - 127.0.0.1:18180:8080
      - 127.0.0.1:18181:8081

volumes:
  n2-data:
