# S-OPS-27：指标抓取。保留 30 天用启动参数 --storage.tsdb.retention.time=30d。
# 启动参数还要有 --web.external-url=<内网域名，不带端口>：通知里的 generatorURL 默认是"主机名:端口"（AC-OPS-07-6）。
# 只监听回环，或只对 console-server、Grafana 开放（firewall.nft）。
global:
  scrape_interval: 15s
  evaluation_interval: 15s

# 还要有 --query.timeout=30s --query.max-samples=20000000：面板查询经 Grafana 来自运维账号，
# 贵查询不能把 Prometheus 拖到影响告警评估。不要加 --web.enable-admin-api、--web.enable-lifecycle。
alerting:
  # webhook 收到的是原始标签，模板管不到这里：instance 是节点的"IP:端口"，发出去之前去掉（AC-OPS-07-6）。
  alert_relabel_configs:
    - action: labeldrop
      regex: instance
  alertmanagers:
    - static_configs:
        - targets: ['127.0.0.1:9093']

rule_files:
  - alerts.yml

scrape_configs:
  # 节点清单由 gen-targets 从 console-server 的节点凭证表生成，node_id 标签和 im_build_info{node_id} 一致。
  - job_name: im
    file_sd_configs:
      - files: ['targets/im.json']
  # 备份指标走 node_exporter 的 textfile（PRD-ops F-OPS-12 规则 4）：告警不经过 console-server。
  - job_name: node
    static_configs:
      - targets: ['127.0.0.1:9100']
